[pytest]
testpaths = tests
pythonpath = src
addopts =
    -ra
    --html=reports/report.html
    --self-contained-html
    --screenshot=only-on-failure
    --tracing=retain-on-failure
    --output=test-results
markers =
    smoke: fast checks that prove the app and framework are alive
    ui: browser tests
    api: HTTP tests with no browser
    regression: broader checks
    exercise: student exercises, skipped until completed
    testcases: the 26 numbered test cases from automationexercise.com/test_cases
